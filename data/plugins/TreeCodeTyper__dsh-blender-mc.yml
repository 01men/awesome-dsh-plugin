url: https://github.com/TreeCodeTyper/dsh-blender-mc
name: TreeCodeTyper/dsh-blender-mc
category: tools
description:
  en: 'Turns a Minecraft Java save into Blender covers and animations: seven tools scan .mca region files for open flat ground, pick camera positions, export geometry, build the scene, render, then use OpenCV to check orientation, grounding, exposure, lighting and composition and re-render with tuned parameters when a shot fails. Requires Blender 4.2 LTS or 5.2 LTS, Python 3.10+ and Node 20+.'
  zh: '把 Minecraft Java 存档做成 Blender 封面与动画：七个工具扫描 .mca region 文件找开阔平地、挑选机位、导出几何、在 Blender 里搭场景并渲染，再用 OpenCV 检查朝向/接地/曝光/布光/构图，不合格自动调参重渲。需 Blender 4.2 LTS 或 5.2 LTS、Python 3.10+ 与 Node 20+。'
